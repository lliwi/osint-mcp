services:

  # ── OSINT API — runs inside Kali container ──────────────────────────────────
  osint-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kali
    command: uvicorn osint_api.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    labels:
      # Imagen construida en local: watchtower no debe intentar pull del registry
      com.centurylinklabs.watchtower.enable: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /tmp/osint-uploads:mode=1777,size=200m
    pids_limit: 256
    mem_limit: 2g
    cpus: "2"
    env_file:
      - ../config/.env
    environment:
      - PYTHONUNBUFFERED=1
      - UPLOAD_DIR=/tmp/osint-uploads
    ports:
      - "127.0.0.1:8001:8001"   # bind to localhost only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MCP Server — stdio/SSE bridge ──────────────────────────────────────────
  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kali
    command: python -m mcp_server.server --transport sse --port 3000
    restart: unless-stopped
    labels:
      # Imagen construida en local: watchtower no debe intentar pull del registry
      com.centurylinklabs.watchtower.enable: "false"
    depends_on:
      osint-api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    pids_limit: 64
    mem_limit: 512m
    cpus: "0.5"
    environment:
      - OSINT_API_URL=http://osint-api:8001
      - OSINT_INTERNAL_API_KEY=${OSINT_INTERNAL_API_KEY:-changeme}
      - OSINT_MODE=${OSINT_MODE:-safe}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      # DNS-rebinding protection: loopback is always accepted. Add any other
      # name this server is reached under (domain, LAN IP), comma-separated.
      # Set it in the shell or in docker/.env — config/.env is only read by osint-api.
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:3000:3000"   # bind to localhost only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

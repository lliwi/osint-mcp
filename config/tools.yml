tools:
  # ── Domain / DNS ──────────────────────────────────────────────────────────
  - name: whois
    category: domain
    type: cli
    binary: whois
    enabled: true
    requires_api_key: false
    risk_level: low
    description: WHOIS lookup for domains and IPs
    inputs: [domain, ip]
    outputs: [registrar, dates, nameservers, contacts]
    parser: whois_parser
    timeout: 30
    allowed_args: ["-H", "-r", "-a"]

  - name: dig
    category: domain
    type: cli
    binary: dig
    enabled: true
    requires_api_key: false
    risk_level: low
    description: DNS record lookup
    inputs: [domain]
    outputs: [dns_records]
    parser: dig_parser
    timeout: 15
    allowed_args: ["+short", "+noall", "+answer", "+nocmd", "ANY", "A", "AAAA", "MX", "NS", "TXT", "SOA", "CNAME", "PTR"]

  - name: subfinder
    category: domain
    type: cli
    binary: subfinder
    enabled: true
    requires_api_key: false
    risk_level: low
    description: Passive subdomain discovery
    inputs: [domain]
    outputs: [subdomains]
    parser: subfinder_parser
    timeout: 120
    allowed_args: ["-d", "-silent", "-o", "-t", "-timeout", "-nW"]

  - name: theHarvester
    category: domain
    type: cli
    binary: theHarvester
    enabled: true
    requires_api_key: false
    risk_level: low
    description: OSINT gathering from public sources — emails, hosts, IPs
    inputs: [domain, email]
    outputs: [emails, hosts, ips]
    parser: theharvester_parser
    timeout: 120
    allowed_args: ["-d", "-l", "-b", "-f", "-S", "-v"]

  - name: httpx
    category: domain
    type: cli
    binary: httpx
    enabled: true
    requires_api_key: false
    risk_level: low
    description: HTTP probing — status, title, server, technology detection
    inputs: [domain, url]
    outputs: [status_code, title, server, technologies]
    parser: httpx_parser
    timeout: 60
    allowed_args: ["-u", "-silent", "-json", "-title", "-status-code", "-tech-detect", "-web-server", "-follow-redirects", "-timeout"]

  - name: whatweb
    category: domain
    type: cli
    binary: whatweb
    enabled: true
    requires_api_key: false
    risk_level: low
    description: Web technology fingerprinting
    inputs: [url]
    outputs: [technologies, cms, frameworks]
    parser: whatweb_parser
    timeout: 30
    allowed_args: ["--log-brief", "--no-errors", "--quiet", "-a"]

  # ── IP / ASN ───────────────────────────────────────────────────────────────
  - name: abuseipdb
    category: ip
    type: api
    enabled: true
    requires_api_key: true
    risk_level: low
    description: AbuseIPDB reputation check
    inputs: [ip]
    outputs: [abuse_reports, confidence_score, isp, country]
    parser: abuseipdb_parser
    timeout: 15
    allowed_args: []

  - name: shodan
    category: ip
    type: api
    enabled: true
    requires_api_key: true
    risk_level: medium
    description: Shodan passive service discovery
    inputs: [ip, domain]
    outputs: [open_ports, banners, vulnerabilities]
    parser: shodan_parser
    timeout: 30
    allowed_args: []

  # ── Email ──────────────────────────────────────────────────────────────────
  - name: holehe
    category: email
    type: cli
    binary: holehe
    enabled: true
    requires_api_key: false
    risk_level: low
    description: Check email registration on online services (no login, no password)
    inputs: [email]
    outputs: [services, registered_count]
    parser: holehe_parser
    timeout: 120
    allowed_args: ["--no-color", "--only-used", "--timeout"]

  - name: ipqualityscore_email
    category: email
    type: api
    enabled: true
    requires_api_key: true
    risk_level: low
    description: IPQualityScore email fraud scoring — disposable detection, spam traps, deliverability, breach exposure, fraud score
    inputs: [email]
    outputs: [fraud_score, valid, disposable, spam_trap, leaked, deliverability, dns_valid, overall_score]
    parser: ipqualityscore_parser
    timeout: 15
    allowed_args: []

  - name: emailrep
    category: email
    type: api
    enabled: true
    requires_api_key: true
    risk_level: low
    description: EmailRep.io reputation API
    inputs: [email]
    outputs: [reputation, suspicious, references, profiles]
    parser: emailrep_parser
    timeout: 15
    allowed_args: []

  - name: hibp
    category: email
    type: api
    enabled: true
    requires_api_key: true
    risk_level: low
    description: Have I Been Pwned breach check
    inputs: [email]
    outputs: [breaches, pastes]
    parser: hibp_parser
    timeout: 15
    allowed_args: []

  # ── Phone ──────────────────────────────────────────────────────────────────
  - name: ipqualityscore_phone
    category: phone
    type: api
    enabled: true
    requires_api_key: true
    risk_level: low
    description: IPQualityScore phone fraud scoring — carrier, line type, spam signals, fraud score, leaked status
    inputs: [phone]
    outputs: [fraud_score, valid, carrier, line_type, country, spammer, leaked, risky, do_not_call, owner_name]
    parser: ipqualityscore_parser
    timeout: 15
    allowed_args: []

  - name: phoneinfoga
    category: phone
    type: cli
    binary: phoneinfoga
    enabled: true
    requires_api_key: false
    risk_level: medium
    description: Phone number OSINT — carrier, line type, spam signals
    inputs: [phone]
    outputs: [carrier, line_type, country, spam_signals, public_mentions]
    parser: phoneinfoga_parser
    timeout: 60
    allowed_args: ["scan", "-n", "--output", "--format"]

  # ── Username / Identity ────────────────────────────────────────────────────
  - name: fullcontact
    category: username
    type: api
    enabled: true
    requires_api_key: true
    risk_level: low
    description: FullContact Person Enrichment — name, employment, social profiles, photo from email/phone/username
    inputs: [email, phone, username]
    outputs: [full_name, location, employment, social_profiles, associated_emails, bio, photo_url]
    parser: fullcontact_parser
    timeout: 15
    allowed_args: []

  - name: peopledatalabs
    category: username
    type: api
    enabled: true
    requires_api_key: true
    risk_level: low
    description: >
      People Data Labs person enrichment — search by full name, email, phone or username.
      Returns location, employment history, education, social profiles, skills and email domains.
      Confidence scored 1-10. Only returns results with likelihood >= 6.
    inputs: [name, email, phone, username, linkedin_url, github_url, twitter_url]
    outputs: [full_name, location, current_job, work_history, education,
              social_profiles, skills, languages, known_email_domains, likelihood]
    parser: peopledatalabs_parser
    timeout: 20
    allowed_args: []

  - name: intelligencex
    category: username
    type: api
    enabled: true
    requires_api_key: true
    risk_level: medium
    description: Intelligence X — search leaks, pastes, darkweb, Telegram and public web for any indicator
    inputs: [email, username, domain, ip, hash, phone]
    outputs: [leak_mentions, paste_mentions, darkweb_mentions, source_type, preview]
    parser: intelligencex_parser
    timeout: 20
    allowed_args: []

  - name: sherlock
    category: username
    type: cli
    binary: sherlock
    enabled: true
    requires_api_key: false
    risk_level: low
    description: Username search across social networks
    inputs: [username]
    outputs: [profiles, urls, confidence]
    parser: sherlock_parser
    timeout: 180
    allowed_args: ["--timeout", "--print-found", "--no-color", "--csv", "--folderoutput", "--site"]

  - name: maigret
    category: username
    type: cli
    binary: maigret
    enabled: true
    requires_api_key: false
    risk_level: low
    description: Advanced username OSINT with profile aggregation
    inputs: [username]
    outputs: [profiles, urls, tags, confidence]
    parser: maigret_parser
    timeout: 180
    allowed_args: ["--timeout", "--no-color", "-a", "--json", "--folderoutput", "--site", "--top-sites"]

  # ── Image ──────────────────────────────────────────────────────────────────
  - name: exiftool
    category: metadata
    type: cli
    binary: exiftool
    enabled: true
    requires_api_key: false
    risk_level: low
    description: >
      Extract and analyse metadata from images (JPEG, PNG, TIFF, RAW, HEIC),
      PDF documents, and office files (DOCX, XLSX, PPTX, ODT, ODS, ODP,
      DOC, XLS, PPT). Detects GPS coordinates, author trail, company info,
      internal paths, revision history and editing software.
    inputs: [filepath]
    outputs: [gps, author, last_modified_by, company, template, revision,
              create_date, modify_date, camera, software, page_count, encryption,
              file_type, mime_type, privacy_risks]
    parser: exiftool_parser
    timeout: 30
    allowed_args: ["-json", "-csv", "-n", "-q", "-s", "-a", "-all", "-ee",
                   "-GPS*", "-Author", "-CreateDate", "-ModifyDate", "-Software", "-FileType"]

  # ── Metadata ───────────────────────────────────────────────────────────────
  - name: mat2
    category: metadata
    type: cli
    binary: mat2
    enabled: true
    requires_api_key: false
    risk_level: low
    description: Show and remove metadata from images, PDFs and office documents
    inputs: [filepath]
    outputs: [metadata_fields, sanitizable_fields]
    parser: mat2_parser
    timeout: 30
    allowed_args: ["--show", "--inplace", "--no-sandbox"]

  - name: pdfinfo
    category: metadata
    type: cli
    binary: pdfinfo
    enabled: true
    requires_api_key: false
    risk_level: low
    description: PDF-specific metadata — author, creator, producer, page count, encryption status
    inputs: [filepath]
    outputs: [author, creator, producer, dates, encrypted, pages, pdf_version]
    parser: pdfinfo_parser
    timeout: 15
    allowed_args: ["-meta", "-enc", "-l"]

  - name: file
    category: metadata
    type: cli
    binary: file
    enabled: true
    requires_api_key: false
    risk_level: low
    description: Detect file type and MIME type from magic bytes (not extension)
    inputs: [filepath]
    outputs: [file_type, mime_type]
    parser: file_parser
    timeout: 10
    allowed_args: ["-b", "-i", "--mime-type"]

  - name: strings
    category: metadata
    type: cli
    binary: strings
    enabled: true
    requires_api_key: false
    risk_level: low
    description: Extract printable strings from binary files — useful for legacy Office formats
    inputs: [filepath]
    outputs: [suspicious_strings, paths, emails, keywords]
    parser: strings_parser
    timeout: 15
    allowed_args: ["-n", "-a"]

  # ── Vehicle ───────────────────────────────────────────────────────────────
  - name: rapidapi_license_plate_spain
    category: vehicle
    type: api
    enabled: true
    requires_api_key: true
    risk_level: medium
    description: >
      Spanish license plate lookup via RapidAPI. Returns brand, model, year, colour,
      fuel type, engine data, ITV status, insurance and DGT environmental badge.
      Owner data (titular) suppressed by default — requires RGPD legal basis.
    inputs: [plate]
    outputs: [brand, model, year, color, fuel_type, engine, itv_status,
              insurance, environmental_badge, stolen_flag]
    parser: vehicle_parser
    timeout: 20
    allowed_args: []

  # ── Breach / Leaks ─────────────────────────────────────────────────────────
  - name: gitleaks
    category: breach
    type: cli
    binary: gitleaks
    enabled: true
    requires_api_key: false
    risk_level: medium
    description: Detect secrets and credentials in git repos / filesystems
    inputs: [filepath]
    outputs: [secrets, rules_matched, files]
    parser: gitleaks_parser
    timeout: 120
    allowed_args: ["detect", "--source", "--report-format", "--report-path", "--no-git", "--verbose"]

  - name: trufflehog
    category: breach
    type: cli
    binary: trufflehog
    enabled: true
    requires_api_key: false
    risk_level: medium
    description: Find credentials and secrets using entropy analysis
    inputs: [filepath, git_url]
    outputs: [secrets, detector_name, verified]
    parser: trufflehog_parser
    timeout: 120
    allowed_args: ["filesystem", "git", "--json", "--no-update", "--concurrency", "--only-verified"]

  - name: virustotal
    category: breach
    type: api
    enabled: true
    requires_api_key: true
    risk_level: low
    description: VirusTotal URL and domain reputation
    inputs: [url, domain, ip, hash]
    outputs: [malicious_count, reputation, last_analysis_date]
    parser: virustotal_parser
    timeout: 30
    allowed_args: []
